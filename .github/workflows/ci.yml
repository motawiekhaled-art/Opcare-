name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux · all tests with real Mosquitto + TimescaleDB
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opcare_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Start Mosquitto broker
        run: |
          mkdir -p "$RUNNER_TEMP/mosquitto"
          printf 'listener 1883\nallow_anonymous true\n' > "$RUNNER_TEMP/mosquitto/mosquitto.conf"
          docker run -d --name mosquitto -p 1883:1883 \
            -v "$RUNNER_TEMP/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf" eclipse-mosquitto:2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: |
          pip install starlette uvicorn jsonschema referencing pytest pyyaml cryptography \
            "paho-mqtt>=2.1,<3" "psycopg[binary]>=3.2" playwright
          python -m playwright install --with-deps chromium
      - name: Connector spec examples
        run: python docs/connector-spec/tools/validate_examples.py
      - name: Tests (unit, end-to-end, browser, real broker + database)
        env:
          OPCARE_TEST_MQTT_URL: mqtt://localhost:1883
          OPCARE_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/opcare_ci
        run: python -m pytest connectors platform edge -v -rs
      - name: Every database statement on PostgreSQL + TimescaleDB
        env:
          PGPASSWORD: postgres
        run: python platform/tools/check_postgres.py "host=localhost port=5432 user=postgres dbname=postgres"
      - name: Broker log
        if: always()
        run: docker logs mosquitto | tail -50

  launcher:
    name: ${{ matrix.os }} · tests + double-click launcher self-test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          pip install starlette uvicorn jsonschema referencing pytest cryptography tzdata
          python -m pytest connectors platform edge -v -rs -k "not gui"
      - name: Windows launcher self-test
        if: runner.os == 'Windows'
        shell: cmd
        run: call "Start Opcare Demo (Windows).bat" --self-test 120
      - name: Mac launcher self-test
        if: runner.os == 'macOS'
        run: bash "Start Opcare Demo (Mac).command" --self-test 120

  snmp-interop:
    name: SNMP connector · interoperability with net-snmp (snmpd, snmptrap, snmpinform)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install net-snmp and Python packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q snmpd snmp
          pip install jsonschema referencing pytest cryptography
      - name: Start snmpd (v1/v2c community + SNMPv3 users with SHA-256, SHA, MD5 and AES)
        run: |
          sudo systemctl stop snmpd || true
          mkdir -p "$RUNNER_TEMP/snmp"
          cat > "$RUNNER_TEMP/snmp/snmpd.conf" <<'CONF'
          agentAddress udp:127.0.0.1:16161
          rocommunity opcare-ci 127.0.0.1
          createUser opcare-sha256 SHA-256 "auth-pass-123" AES "priv-pass-456"
          createUser opcare-sha SHA "auth-pass-123" AES "priv-pass-456"
          createUser opcare-md5 MD5 "auth-pass-123" AES "priv-pass-456"
          rouser opcare-sha256 priv
          rouser opcare-sha priv
          rouser opcare-md5 priv
          sysName opcare-ci-agent
          sysLocation CI runner
          CONF
          sudo snmpd -C -c "$RUNNER_TEMP/snmp/snmpd.conf" -Lf "$RUNNER_TEMP/snmp/snmpd.log" -p "$RUNNER_TEMP/snmp/snmpd.pid" \
            --persistentDir="$RUNNER_TEMP/snmp/persist"
          sleep 2
          snmpget -v 2c -c opcare-ci 127.0.0.1:16161 1.3.6.1.2.1.1.5.0
          snmpget -v 3 -l authPriv -u opcare-sha256 -a SHA-256 -A auth-pass-123 -x AES -X priv-pass-456 127.0.0.1:16161 1.3.6.1.2.1.1.5.0
      - name: Interoperability tests
        env:
          OPCARE_NETSNMP_PORT: "16161"
        run: python -m pytest connectors/snmp/tests/test_netsnmp_interop.py -v -rs
      - name: snmpd log
        if: always()
        run: sudo cat "$RUNNER_TEMP/snmp/snmpd.log" | tail -50

  opcua-interop:
    name: OPC UA · interoperability with an independent server (asyncua, test-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages (asyncua is a test opponent only; it is never in the product or its images)
        run: pip install jsonschema referencing pytest cryptography "paho-mqtt>=2.1,<3" asyncua
      - name: Interoperability tests (None, Basic256Sha256, Aes256_Sha256_RsaPss; username sign-in; browse)
        run: python -m pytest connectors/opcua/tests -v -rs

  dnp3-interop:
    name: DNP3 · interoperability with opendnp3 (dnp3-python, test-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"        # dnp3-python wheels exist for Python 3.8-3.10 only
      - name: Install packages (dnp3-python / opendnp3 is a test opponent only; never in the product or its images)
        run: pip install jsonschema referencing pytest cryptography "paho-mqtt>=2.1,<3" dnp3-python
      - name: Interoperability tests (integrity, class polls, unsolicited, restart bit, test connection)
        env:
          OPCARE_DNP3_INTEROP_PY: python
        run: python -m pytest connectors/dnp3/tests -v -rs

  iec61850-interop:
    name: IEC 61850 · interoperability with IEC61850bean (test-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the IEC61850bean MMS server (Apache-2.0, from source; test opponent only, never in the product)
        run: echo "OPCARE_IEC61850_INTEROP_CP=$(tools/interop/build_iec61850bean.sh "$RUNNER_TEMP/iec61850bean" | tail -1)" >> "$GITHUB_ENV"
      - name: Install packages
        run: pip install jsonschema referencing pytest cryptography "paho-mqtt>=2.1,<3"
      - name: Interoperability tests (reports, polling, quality, browse, test connection)
        run: python -m pytest connectors/iec61850/tests -v -rs

  iec104-interop:
    name: IEC 104 · interoperability with lib60870's example server (test-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build lib60870's cs104_server (GPLv3, downloaded and built here; test opponent only, never committed or shipped)
        run: echo "OPCARE_IEC104_INTEROP_SERVER=$(tools/interop/build_lib60870_server.sh "$RUNNER_TEMP/lib60870" | tail -1)" >> "$GITHUB_ENV"
      - name: Install packages
        run: pip install jsonschema referencing pytest cryptography "paho-mqtt>=2.1,<3"
      - name: Interoperability tests (interrogation, packed sequences, periodic data, rejected requests)
        run: python -m pytest connectors/iec104/tests -v -rs

  docker:
    name: Container images build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Modbus connector image
        run: docker build -f connectors/modbus/Dockerfile -t opcare/connector-modbus:ci .
      - name: UDP connector image
        run: docker build -f connectors/udp/Dockerfile -t opcare/connector-udp:ci .
      - name: SNMP connector image
        run: docker build -f connectors/snmp/Dockerfile -t opcare/connector-snmp:ci .
      - name: MQTT connector image
        run: docker build -f connectors/mqtt/Dockerfile -t opcare/connector-mqtt:ci .
      - name: IEC 61850 connector image
        run: docker build -f connectors/iec61850/Dockerfile -t opcare/connector-iec61850:ci .
      - name: "IEC 61850 image holds no IEC 61850 / MMS library (Opcare's own stack only)"
        run: |
          docker run --rm --entrypoint python opcare/connector-iec61850:ci -c \
            "import importlib.util as u, sys; bad=[m for m in ('pyiec61850','iec61850','libiec61850') if u.find_spec(m)]; print('found', bad); sys.exit(1 if bad else 0)"
      - name: DNP3 connector image
        run: docker build -f connectors/dnp3/Dockerfile -t opcare/connector-dnp3:ci .
      - name: "DNP3 image holds no DNP3 library (Opcare's own stack only)"
        run: |
          docker run --rm --entrypoint python opcare/connector-dnp3:ci -c \
            "import importlib.util as u, sys; bad=[m for m in ('pydnp3','dnp3_python','dnp3') if u.find_spec(m)]; print('found', bad); sys.exit(1 if bad else 0)"
      - name: IEC 104 connector image
        run: docker build -f connectors/iec104/Dockerfile -t opcare/connector-iec104:ci .
      - name: "IEC 104 image holds no IEC 104 library (Opcare's own stack only) and knows time zones"
        run: |
          docker run --rm --entrypoint python opcare/connector-iec104:ci -c \
            "import importlib.util as u, sys, glob, zoneinfo; bad=[m for m in ('c104','lib60870','iec104','pyiec60870') if u.find_spec(m)] + glob.glob('/usr/**/lib60870*', recursive=True); zoneinfo.ZoneInfo('Africa/Cairo'); print('found', bad); sys.exit(1 if bad else 0)"
      - name: OPC UA connector image
        run: docker build -f connectors/opcua/Dockerfile -t opcare/connector-opcua:ci .
      - name: "OPC UA image holds no OPC UA library (Opcare's own stack only)"
        run: |
          docker run --rm --entrypoint python opcare/connector-opcua:ci -c \
            "import importlib.util as u, sys; bad=[m for m in ('asyncua','opcua') if u.find_spec(m)]; print('found', bad); sys.exit(1 if bad else 0)"
      - name: Platform image
        run: docker build -f platform/Dockerfile -t opcare/daq-platform:ci .
      - name: "Connector image refuses to start without its environment (spec: exit code 2)"
        run: |
          set +e
          for c in modbus udp snmp mqtt opcua dnp3 iec61850 iec104; do
            docker run --rm --read-only "opcare/connector-$c:ci"
            code=$?
            echo "$c exit code $code"
            test "$code" -eq 2 || exit 1
          done
