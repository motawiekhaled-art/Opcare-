<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opcare DAQ – Live values</title>
<link rel="icon" href="/static/opcare-logo.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="/static/opcare-logo.png" alt="Opcare Smart Services" class="logo">
    <span class="divider" aria-hidden="true"></span>
    <div>
      <div class="app-title">Data Acquisition Platform</div>
      <div class="app-sub">Live values</div>
    </div>
  </div>
  <div class="top-right">
    <span class="live" id="live" data-state="connecting"><span class="dot" aria-hidden="true"></span><span id="live-text">Connecting</span></span>
    <span class="user" id="user"></span>
    <button type="button" class="btn ghost" id="signout">Sign out</button>
  </div>
</header>
<div class="accent" aria-hidden="true"><span></span><i></i></div>

<main class="layout">
  <section class="panel sources" aria-labelledby="h-sources">
    <h2 id="h-sources">Sources</h2>
    <div id="source-list" class="source-list"><p class="muted">Loading…</p></div>
  </section>

  <section class="panel values" aria-labelledby="h-values">
    <div class="kpis" id="kpis">
      <div class="kpi"><span class="kpi-label">Tags</span><span class="kpi-value" id="k-tags">–</span></div>
      <div class="kpi"><span class="kpi-label">Good quality</span><span class="kpi-value" id="k-good">–</span></div>
      <div class="kpi"><span class="kpi-label">Bad quality</span><span class="kpi-value" id="k-bad">–</span></div>
      <div class="kpi"><span class="kpi-label">Values received</span><span class="kpi-value" id="k-rate">–</span></div>
    </div>
    <div class="values-head">
      <h2 id="h-values">Live values</h2>
      <div class="filters">
        <label class="sr" for="filter">Filter tags</label>
        <input id="filter" type="search" placeholder="Filter tags…" autocomplete="off">
        <label class="sr" for="quality-filter">Quality</label>
        <select id="quality-filter">
          <option value="">All quality</option>
          <option value="good">Good</option>
          <option value="uncertain">Uncertain</option>
          <option value="bad">Bad</option>
        </select>
      </div>
    </div>
    <div class="table-wrap">
      <table class="tags">
        <thead><tr><th scope="col">Tag</th><th scope="col" class="num">Value</th><th scope="col">Quality</th><th scope="col">Device time</th><th scope="col" class="num">Age</th></tr></thead>
        <tbody id="tag-rows"></tbody>
      </table>
      <p class="muted empty" id="no-tags" hidden>No tags match.</p>
    </div>
    <div class="detail" id="detail" hidden>
      <div class="detail-head">
        <div><div class="detail-title" id="d-title"></div><div class="muted" id="d-sub"></div></div>
        <div class="detail-actions">
          <label class="sr" for="d-range">History range</label>
          <select id="d-range"><option value="5">5 min</option><option value="15" selected>15 min</option><option value="60">1 hour</option></select>
          <button type="button" class="btn ghost" id="d-close">Close</button>
        </div>
      </div>
      <div id="chart" class="chart" role="img" aria-label="History chart"></div>
    </div>
  </section>

  <section class="panel events" aria-labelledby="h-events">
    <h2 id="h-events">Events</h2>
    <ol id="event-list" class="event-list"></ol>
  </section>
</main>

<div class="modal" id="login" hidden>
  <form class="modal-box" id="login-form">
    <img src="/static/opcare-logo.png" alt="Opcare Smart Services" class="logo">
    <h2>Sign in</h2>
    <label for="token">Access token</label>
    <input id="token" type="password" autocomplete="current-password" required>
    <p class="error" id="login-error" hidden>That token was not accepted.</p>
    <button type="submit" class="btn primary">Sign in</button>
  </form>
</div>

<div class="modal" id="test-modal" hidden>
  <div class="modal-box wide" role="dialog" aria-modal="true" aria-labelledby="t-title">
    <h2 id="t-title">Test connection</h2>
    <div id="t-body"></div>
    <button type="button" class="btn primary" id="t-close">Close</button>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
