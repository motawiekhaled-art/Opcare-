[project]
name = "opcare-connector-sdk"
version = "0.1.0"
description = "Opcare DAQ connector SDK (spec OSS-DAQ-CON-001 1.0)"
requires-python = ">=3.11"
license = { text = "LicenseRef-Opcare-Proprietary" }
dependencies = [
  "paho-mqtt>=2.1,<3",     # EPL-2.0 / EDL-1.0
  "jsonschema>=4.18",      # MIT
  "referencing>=0.30",     # MIT
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["opcare_connector_sdk"]
